<div class="modal-overlay" *ngIf="isVisible" (click)="cancelar()">
  <div class="modal-caja" (click)="$event.stopPropagation()">
    <h2 class="modal-titulo">{{ usuarioAEditar ? 'Editar Usuario' : 'Agregar Usuario' }}</h2>

    <div class="form-group">
      <label>Nombre de Usuario</label>
      <input type="text" [(ngModel)]="nombre" placeholder="Escribe el nombre aquí..." class="input-oscuro">
    </div>

    <div class="form-group">
      <label>Selecciona un avatar</label>
      <div class="skeleton-grid" *ngIf="isLoadingAvatars">
        <div class="skeleton-avatar" *ngFor="let item of [1,2,3,4,5,6,7,8]"></div>
      </div>
      <div class="avatar-grid" *ngIf="!isLoadingAvatars">
        <img 
          *ngFor="let avatar of avataresDisponibles" 
          [src]="getAvatarPath(avatar)" 
          [alt]="avatar"
          [class.seleccionado]="avatarSeleccionado === avatar"
          (click)="seleccionarAvatar(avatar)"
          onerror="this.src='https://ui-avatars.com/api/?name=Usuario&background=1565C0&color=fff&size=200'"
        />
      </div>
    </div>

    <div class="modal-acciones">
      <button class="btn-cancelar" (click)="cancelar()">Cancelar</button>
      <button class="btn-guardar" (click)="guardar()">Guardar Cambios</button>
    </div>
  </div>
</div>
